name: Verify focused extraction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and verification tools
        run: python -m pip install --upgrade pip pytest build -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src
      - name: Build wheel and source archive
        run: python -m build
